# Publishes a release of Tune the owner asked for (AGENTS.md: publishing needs the owner's explicit
# go-ahead), on a disposable Windows runner: the unit tests, the build, the check of what is packed,
# then a GitHub release with the installer and its update files, and the notes from
# docs/release-notes/v<version>.md. It runs for a pushed tag v<version>, or for a pushed commit whose
# message asks for it with "[release v<version>]" (where tags can't be pushed from); the tag must match
# package.json, and a release that already exists is never replaced. For a commit, the tag is created
# at that commit with the release.
# A version with a pre-release part (1.4.0-beta.1) becomes a GitHub pre-release: installed copies of
# a regular release keep updating from the latest regular release (electron-updater skips
# pre-releases), so only people who download it get it.
# Production publication requires the owner's real certificate and a full green CI run for the
# exact commit. CI test installers are still available without a production certificate.
name: Release

on:
  push:
    tags: ['v*']
    branches: ['main', 'claude/**']

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release v') }}
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: the tag is this version, its notes are written, and it isn't released yet
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like 'refs/tags/*') { $tag = $env:GITHUB_REF_NAME }
          else { $m = [regex]::Match([string]$env:MESSAGE, '\[release (v[0-9A-Za-z.\-]+)\]'); if (-not $m.Success) { throw 'no [release v<version>] in the commit message' }; $tag = $m.Groups[1].Value }
          if ("v$v" -ne $tag) { throw "$tag does not match package.json version $v" }
          if (-not (Test-Path "docs/release-notes/v$v.md")) { throw "no release notes at docs/release-notes/v$v.md" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "$tag is already released; a release is never replaced" }
          $global:LASTEXITCODE = 0  # "not found" is what was wanted; the step must not end with it
          "VERSION=$v" >> $env:GITHUB_ENV
          "TAG=$tag" >> $env:GITHUB_ENV
      - name: full Windows CI passed for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/release-gate.cjs
      - run: npm audit --audit-level=moderate
      - run: npm test
      - name: prepare the production signing certificate
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.CSC_LINK }}
          CERT_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE -or -not $env:CERT_PASSWORD) { throw 'Production signing is not configured. Configure CSC_LINK (base64 PFX) and CSC_KEY_PASSWORD before publishing. Test builds remain available from CI.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'tune-production-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE))
          $c = New-Object Security.Cryptography.X509Certificates.X509Certificate2($pfx, $env:CERT_PASSWORD)
          if (-not $c.HasPrivateKey -or $c.NotAfter -le (Get-Date) -or $c.Subject -eq $c.Issuer) { throw 'A current production certificate with its private key is required; self-signed test certificates cannot publish.' }
          $publisher = $c.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          "CSC_LINK=$pfx" >> $env:GITHUB_ENV
          "CSC_KEY_PASSWORD=$env:CERT_PASSWORD" >> $env:GITHUB_ENV
          "TUNE_CI_SIGNER=$($c.Thumbprint)" >> $env:GITHUB_ENV
          "SIGNING_PUBLISHER=$publisher" >> $env:GITHUB_ENV
          'TUNE_SIGN_TIMESTAMP_URL=http://timestamp.digicert.com' >> $env:GITHUB_ENV
      - name: build with the production certificate
        shell: pwsh
        run: npm run dist -- --publish never "-c.win.publisherName=$env:SIGNING_PUBLISHER"
      - name: packed contents; development licensing overrides ignored
        run: node scripts/ci/packaged-check.cjs
      - name: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem release -File | Where-Object { $_.Name -match '^Tune-Setup-.*\.exe(\.blockmap)?$' -or $_.Name -match '^(latest|beta|alpha)\.yml$' } | ForEach-Object FullName)
          if (-not ($files | Where-Object { $_ -match '\.exe$' })) { throw 'no installer in release/' }
          $kind = if ($env:VERSION -match '-') { '--prerelease' } else { '--latest' }
          # a pushed tag is used as it is; otherwise the tag is made at this commit
          $where = if ($env:GITHUB_REF -like 'refs/tags/*') { '--verify-tag' } else { "--target=$env:GITHUB_SHA" }
          gh release create $env:TAG --repo $env:GITHUB_REPOSITORY $where --title "$env:VERSION" --notes-file "docs/release-notes/v$env:VERSION.md" $kind @files
          if ($LASTEXITCODE) { throw "gh release create exited $LASTEXITCODE" }
      - name: remove the temporary signing file
        if: ${{ always() }}
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'tune-production-signing.pfx') -Force -ErrorAction SilentlyContinue

# Publishes a release of Tune the owner asked for (AGENTS.md: publishing needs the owner's explicit
# go-ahead). Runs only on a pushed tag v<version> that matches package.json, on a disposable Windows
# runner: the unit tests, the build, the check of what is packed, then a GitHub release with the
# installer and its update files, and the notes from docs/release-notes/v<version>.md.
# A version with a pre-release part (1.4.0-beta.1) becomes a GitHub pre-release: installed copies of
# a regular release keep updating from the latest regular release (electron-updater skips
# pre-releases), so only people who download it get it.
# Unsigned until there is a code-signing certificate (audit TUN-09, decision 9 in
# docs/roadmap/decisions-he.md); then CSC_LINK and CSC_KEY_PASSWORD come from the repository's secrets.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: the tag is this version, and its notes are written
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match package.json version $v" }
          if (-not (Test-Path "docs/release-notes/v$v.md")) { throw "no release notes at docs/release-notes/v$v.md" }
          "VERSION=$v" >> $env:GITHUB_ENV
      - run: npm test
      - name: build (unsigned)
        run: npm run dist -- --publish never
      - name: packed contents; development licensing overrides ignored
        run: node scripts/ci/packaged-check.cjs
      - name: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem release -File | Where-Object { $_.Name -match '^Tune-Setup-.*\.exe(\.blockmap)?$' -or $_.Name -match '^(latest|beta|alpha)\.yml$' } | ForEach-Object FullName)
          if (-not ($files | Where-Object { $_ -match '\.exe$' })) { throw 'no installer in release/' }
          $kind = if ($env:VERSION -match '-') { '--prerelease' } else { '--latest' }
          gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --title "$env:VERSION" --notes-file "docs/release-notes/v$env:VERSION.md" $kind @files
          if ($LASTEXITCODE) { throw "gh release create exited $LASTEXITCODE" }

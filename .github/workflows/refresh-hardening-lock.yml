# One-time read-only lockfile generation. Removed after reviewing the generated file.
name: Refresh hardening lockfile
on:
  push:
    branches: ['claude/tune-core-hardening-20261019']
permissions:
  contents: read
jobs:
  lock:
    if: ${{ contains(github.event.head_commit.message, '[refresh-lockfile]') }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve without running dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Return the generated file for review (no write credentials, commit, or push)
        shell: pwsh
        run: |
          node -e "const fs=require('fs'); const b=fs.readFileSync('package-lock.json').toString('base64'); for(let i=0;i<b.length;i+=4000)console.log('TUNE_LOCK_PART '+i+' '+b.slice(i,i+4000)); const p=JSON.parse(fs.readFileSync('package-lock.json')); console.log('TUNE_LOCK_VERSIONS '+JSON.stringify(Object.fromEntries(Object.entries(p.packages).filter(([k])=>/node_modules\/(vite|esbuild|@electron\/get)$/.test(k)).map(([k,v])=>[k,v.version]))));"
          $hash = git hash-object package-lock.json
          "TUNE_LOCK_GIT_SHA $hash"
      - name: Record all audit findings
        shell: pwsh
        run: |
          npm audit --json > dependency-audit.json
          node -e "const a=JSON.parse(require('fs').readFileSync('dependency-audit.json')); console.log('TUNE_AUDIT '+JSON.stringify(a));"
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: hardening-dependency-files
          path: |
            package-lock.json
            dependency-audit.json
          retention-days: 7
